<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversas Bibi | BCK</title>
    <style>
      :root{--bg:#f4f6f8;--panel:#fff;--line:#d8e0e5;--text:#172126;--muted:#667984;--brand:#087766;--brand2:#075c50;--client:#eef3f6;--bibi:#ddf3ea;--system:#fff3cf;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 22px}h1{font-size:22px;margin:0}main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{background:var(--panel);border-right:1px solid var(--line);padding:16px}label{color:var(--muted);display:block;font-size:12px;font-weight:700;margin:13px 0 6px;text-transform:uppercase}input,button{border-radius:8px;font:inherit;min-height:42px}input{border:1px solid var(--line);padding:9px 11px;width:100%}button{background:var(--brand);border:0;color:#fff;cursor:pointer;font-weight:700;margin-top:12px;padding:0 14px;width:100%}button:hover{background:var(--brand2)}.hint,.status{color:var(--muted);font-size:13px;line-height:1.45}.customers{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.customer{background:transparent;border:1px solid transparent;color:var(--text);display:block;margin:0 0 6px;min-height:auto;padding:10px;text-align:left;width:100%}.customer:hover,.customer.is-active{background:#edf5f2;border-color:#b9d9d0}.customer strong,.customer span{display:block;overflow-wrap:anywhere}.customer span{color:var(--muted);font-size:12px;margin-top:3px}.thread{padding:22px}.toolbar{align-items:center;display:flex;gap:12px;justify-content:space-between;margin-bottom:14px}.messages{display:flex;flex-direction:column;gap:10px}.message{border:1px solid var(--line);border-radius:8px;max-width:790px;padding:12px;white-space:pre-wrap}.message.inbound{background:var(--client)}.message.outbound{align-self:flex-end;background:var(--bibi)}.message.system{background:var(--system)}.meta{color:var(--muted);display:flex;flex-wrap:wrap;font-size:12px;gap:8px;margin-bottom:7px}.empty{color:var(--muted);padding:26px 0}@media(max-width:780px){main{grid-template-columns:1fr}aside{border-bottom:1px solid var(--line);border-right:0}.thread{padding:16px}}
    </style>
  </head>
  <body>
    <header><h1>Conversas da Bibi</h1></header>
    <main>
      <aside>
        <p class="hint">Painel protegido para ver contatos e sessoes recentes salvas pelo atendimento da Bibi.</p>
        <label for="token">Token</label><input id="token" type="password" autocomplete="current-password" placeholder="Token admin">
        <label for="phone">Telefone</label><input id="phone" inputmode="numeric" placeholder="5528999849520">
        <label for="day">Dia</label><input id="day" type="date">
        <button id="load" type="button">Carregar</button>
        <p id="status" class="status"></p>
        <div id="customers" class="customers"></div>
      </aside>
      <section class="thread">
        <div class="toolbar"><strong id="threadTitle">Nenhuma conversa carregada</strong><span id="count" class="status"></span></div>
        <div id="messages" class="messages"></div>
      </section>
    </main>
    <script>
      const tokenInput=document.querySelector('#token'),phoneInput=document.querySelector('#phone'),dayInput=document.querySelector('#day'),loadButton=document.querySelector('#load'),statusEl=document.querySelector('#status'),customersEl=document.querySelector('#customers'),messagesEl=document.querySelector('#messages'),threadTitleEl=document.querySelector('#threadTitle'),countEl=document.querySelector('#count');
      tokenInput.value=localStorage.getItem('bckBibiConversationsToken')||'';dayInput.value=new Date().toISOString().slice(0,10);loadButton.addEventListener('click',loadConversations);
      async function loadConversations(){const token=tokenInput.value.trim();if(!token)return setStatus('Informe o token.',true);localStorage.setItem('bckBibiConversationsToken',token);setStatus('Carregando...',false);const params=new URLSearchParams({limit:'300'});if(phoneInput.value.trim())params.set('phone',phoneInput.value.trim());if(dayInput.value)params.set('day',dayInput.value);try{const response=await fetch('/.netlify/functions/bibi-conversations?'+params,{headers:{'X-BCK-Admin-Token':token}});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||data.error||'Falha ao carregar.');render(data);setStatus(`${data.events.length} mensagens, ${data.contacts.length} contatos, ${data.sessions.length} sessoes.`,false)}catch(error){render({events:[],contacts:[],sessions:[]});setStatus(error.message||'Nao consegui carregar.',true)}}
      function render(data){const grouped=groupThreads(data.events||[],data.sessions||[],data.contacts||[]);const phones=Object.keys(grouped).sort((a,b)=>String(grouped[b].updatedAt||'').localeCompare(String(grouped[a].updatedAt||'')));customersEl.innerHTML='';for(const phone of phones){const thread=grouped[phone];const button=document.createElement('button');button.type='button';button.className='customer';button.innerHTML=`<strong>${thread.name||formatPhone(phone)}</strong><span>${thread.preview||formatPhone(phone)}</span>`;button.addEventListener('click',()=>showThread(phone,thread,button));customersEl.appendChild(button)}if(phones.length)customersEl.querySelector('.customer').click();else{threadTitleEl.textContent='Nenhuma conversa encontrada';countEl.textContent='';messagesEl.innerHTML='<p class="empty">Quando houver historico salvo, ele aparece aqui.</p>'}}
      function groupThreads(events,sessions,contacts){const grouped={};for(const contact of contacts){const phone=contact.phone||'';if(!phone)continue;grouped[phone]=grouped[phone]||emptyThread(phone);grouped[phone].name=contact.profileName||grouped[phone].name;grouped[phone].updatedAt=maxDate(grouped[phone].updatedAt,contact.lastSeenAt);grouped[phone].preview=grouped[phone].preview||`Visto por ultimo: ${formatDate(contact.lastSeenAt)}`}for(const session of sessions){const phone=session.phone||'';if(!phone)continue;grouped[phone]=grouped[phone]||emptyThread(phone);grouped[phone].updatedAt=maxDate(grouped[phone].updatedAt,session.updatedAt);grouped[phone].preview=session.state||grouped[phone].preview;for(const item of session.history||[]){if(item.customer)grouped[phone].messages.push({createdAt:item.at,direction:'inbound',text:item.customer,status:'session'});if(item.bhibi)grouped[phone].messages.push({createdAt:item.at,direction:'outbound',text:item.bhibi,status:'session'})}}for(const event of events){const phone=event.phone||'';if(!phone)continue;grouped[phone]=grouped[phone]||emptyThread(phone);grouped[phone].updatedAt=maxDate(grouped[phone].updatedAt,event.createdAt);grouped[phone].preview=event.text||grouped[phone].preview;grouped[phone].messages.push(event)}return grouped}
      function emptyThread(phone){return{phone,name:'',preview:'',updatedAt:'',messages:[]}}function showThread(phone,thread,button){customersEl.querySelectorAll('.customer').forEach(item=>item.classList.remove('is-active'));button.classList.add('is-active');const sorted=[...thread.messages].sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));threadTitleEl.textContent=thread.name?`${thread.name} - ${formatPhone(phone)}`:formatPhone(phone);countEl.textContent=`${sorted.length} mensagens`;messagesEl.innerHTML='';if(!sorted.length){messagesEl.innerHTML='<p class="empty">Este contato ainda nao tem historico de mensagem salvo no painel.</p>';return}for(const item of sorted){const card=document.createElement('article');card.className=`message ${item.direction||'system'}`;card.innerHTML=`<div class="meta"><span>${formatDate(item.createdAt)}</span><span>${labelDirection(item.direction)}</span><span>${item.status||''}</span></div><div></div>`;card.querySelector('div:last-child').textContent=item.text||'';messagesEl.appendChild(card)}}
      function labelDirection(direction){if(direction==='inbound')return'Cliente';if(direction==='outbound')return'Bibi';return'Sistema'}function maxDate(a,b){return String(b||'').localeCompare(String(a||''))>0?b:a}function formatPhone(phone){return phone?`+${phone}`:'Sem telefone'}function formatDate(value){if(!value)return'';return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(value))}function setStatus(message,isError){statusEl.textContent=message;statusEl.style.color=isError?'#9f1d1d':''}
    </script>
  </body>
</html>
