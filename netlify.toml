[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/pdv/pedidos-pendentes"
  to = "/.netlify/functions/pdv-pending-orders"
  status = 200

[[redirects]]
  from = "/api/pdv/pedido-status"
  to = "/.netlify/functions/pdv-order-status"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
