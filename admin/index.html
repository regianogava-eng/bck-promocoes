<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Admin | BCK Beer Chicken</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
    <style>
      body {
        margin: 0;
        background: #f4f5f7;
        color: #16181d;
        font-family: Inter, Arial, sans-serif;
      }

      .admin-loading {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100vh;
        justify-content: center;
        text-align: center;
      }

      .admin-loading strong {
        font-size: 18px;
      }

      .admin-loading span {
        color: #667085;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="admin-loading" id="admin-loading">
      <strong>Carregando painel BCK</strong>
      <span>Aguarde alguns segundos enquanto o admin conecta ao Netlify.</span>
    </div>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      window.CMS_MANUAL_INIT = true;

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("login", function () {
          window.netlifyIdentity.close();
          document.location.href = "/admin/";
        });
      }

      function startBckCms() {
        if (!window.CMS) return;
        window.CMS.init();
        var loader = document.getElementById("admin-loading");
        if (loader) loader.remove();
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.10/dist/decap-cms.js" onload="startBckCms()"></script>
  </body>
</html>
