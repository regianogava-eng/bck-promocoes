backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

site_url: "https://beerchicken-bck.netlify.app"
display_url: "https://beerchicken-bck.netlify.app"
logo_url: "/assets/images/hero-bck-feast-mobile.webp"

collections:
  - name: "catalogo"
    label: "Painel BCK"
    files:
      - name: "promocoes"
        label: "Editar ofertas do site"
        file: "data/catalog.json"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Abas do site"
            name: "categories"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Aqui ficam as abas que aparecem no site. Nao mexa no ID se a aba ja existir."
            fields:
              - label: "ID interno da aba"
                name: "id"
                widget: "string"
                hint: "Exemplos: combos, frango, pizza, batata, porcoes-carne, bebidas, hamburguer."
              - label: "Nome da aba"
                name: "title"
                widget: "string"
              - label: "Icone curto"
                name: "icon"
                widget: "string"
                required: false
              - label: "Descricao curta"
                name: "description"
                widget: "string"
                required: false

          - label: "Promocoes e combos que aparecem no site"
            name: "products"
            widget: "list"
            collapsed: true
            label_singular: "Oferta"
            summary: "{{fields.title}} - R$ {{fields.promoPrice}}"
            hint: "Para criar um combo, marque 'E combo' e escolha as abas onde ele aparece, como Combos, Pizza e Frango."
            fields:
              - label: "ID interno"
                name: "id"
                widget: "string"
                hint: "Use letras, numeros e hifens. Exemplo: combo-pizza-frango."
              - label: "Ativo no site"
                name: "active"
                widget: "boolean"
                default: true
              - label: "Oferta principal do dia"
                name: "featured"
                widget: "boolean"
                default: false
                required: false
                hint: "Deixe somente uma oferta marcada como principal."
              - label: "E combo"
                name: "combo"
                widget: "boolean"
                default: false
                required: false
              - label: "Nome da promocao ou combo"
                name: "title"
                widget: "string"
              - label: "Descricao de venda"
                name: "description"
                widget: "text"
                hint: "Escreva curto e apetitoso. Exemplo: crocante, queijo derretido, bebida gelada."
              - label: "Imagem"
                name: "image"
                widget: "image"
                choose_url: false
                required: true
              - label: "Abas onde aparece"
                name: "categories"
                widget: "select"
                multiple: true
                min: 1
                options:
                  - { label: "Combos", value: "combos" }
                  - { label: "Frango", value: "frango" }
                  - { label: "Pizza", value: "pizza" }
                  - { label: "Batata recheada", value: "batata" }
                  - { label: "Porcoes de carne", value: "porcoes-carne" }
                  - { label: "Bebidas", value: "bebidas" }
                  - { label: "Hamburguer futuro", value: "hamburguer" }
              - label: "Preco promocional"
                name: "promoPrice"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.01
              - label: "Preco antigo"
                name: "originalPrice"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.01
                required: false
                hint: "Opcional. Quando preenchido, aparece como preco riscado."
              - label: "Selo da oferta"
                name: "badge"
                widget: "select"
                options:
                  - "Mais pedido"
                  - "Relampago"
                  - "Combo da noite"
                  - "Oferta limitada"
                  - "Crocancia"
                  - "Add rapido"
                  - "Em breve"
              - label: "Cor do selo"
                name: "badgeType"
                widget: "select"
                default: "best"
                options:
                  - { label: "Dourado", value: "best" }
                  - { label: "Vermelho relampago", value: "flash" }
                  - { label: "Verde limitado", value: "limited" }
                  - { label: "Quente", value: "hot" }
              - label: "Itens que aparecem dentro da oferta"
                name: "components"
                widget: "list"
                required: false
                hint: "Exemplo: Pizza pequena, Frango 500g, Refri 2L."
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"
              - label: "Prioridade de exibicao"
                name: "sortScore"
                widget: "number"
                value_type: "int"
                default: 50
                min: 0
                max: 999
                hint: "Quanto maior, mais acima aparece. Sugestao: 100 para oferta principal."
