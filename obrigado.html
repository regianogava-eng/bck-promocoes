<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido confirmado | BCK Beer Chicken</title>
    <meta
      name="description"
      content="Obrigado por escolher a BCK Beer Chicken. Seu pedido foi confirmado pelo WhatsApp."
    >
    <meta name="theme-color" content="#080808">
    <meta property="og:title" content="Pedido confirmado | BCK Beer Chicken">
    <meta property="og:description" content="Seu pedido foi confirmado pela equipe da BCK Beer Chicken.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://beerchicken-bck.netlify.app/obrigado">
    <meta property="og:image" content="assets/images/bck-mascot-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap"
      rel="stylesheet"
    >
    <link rel="preload" as="image" href="assets/images/bck-mascot-logo.png">
    <script src="config.js"></script>
    <script>
      (function () {
        var googleAdsId = "AW-18132933431";
        window.dataLayer = window.dataLayer || [];
        if (typeof window.gtag !== "function") {
          window.gtag = function gtag() {
            window.dataLayer.push(arguments);
          };
          window.gtag("js", new Date());
        }

        var script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(googleAdsId);
        document.head.appendChild(script);

        window.gtag("config", googleAdsId);
      })();
    </script>
    <script>
      (function () {
        var config = window.BCK_CONFIG || {};
        var pixelId = String((config.placeholders && config.placeholders.metaPixelId) || config.metaPixelId || "").trim();
        var isReadyPixel = pixelId && !pixelId.includes("XXXX") && !/^0+$/.test(pixelId);
        if (!isReadyPixel || typeof window.fbq === "function") return;

        window.fbq = function fbq() {
          if (window.fbq.callMethod) {
            window.fbq.callMethod.apply(window.fbq, arguments);
            return;
          }
          window.fbq.queue.push(arguments);
        };
        window._fbq = window.fbq;
        window.fbq.push = window.fbq;
        window.fbq.loaded = true;
        window.fbq.version = "2.0";
        window.fbq.queue = [];

        var script = document.createElement("script");
        script.async = true;
        script.src = "https://connect.facebook.net/pt_BR/fbevents.js";
        document.head.appendChild(script);

        window.fbq("init", pixelId);
        window.fbq("track", "PageView");
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bck-bg: #080808;
        --bck-red: #d71920;
        --bck-gold: #ffc84a;
        --bck-cream: #fff7ea;
        --bck-muted: rgba(255, 247, 234, 0.72);
        --bck-line: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--bck-cream);
        background:
          linear-gradient(120deg, rgba(215, 25, 32, 0.2), transparent 42%),
          radial-gradient(circle at 72% 12%, rgba(255, 200, 74, 0.18), transparent 28%),
          var(--bck-bg);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(24px, 5vw, 56px);
      }

      .receipt {
        width: min(100%, 760px);
        text-align: center;
      }

      .brand-logo {
        width: min(280px, 72vw);
        height: auto;
        margin-bottom: clamp(28px, 6vw, 44px);
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45));
      }

      .check {
        display: inline-grid;
        width: 70px;
        height: 70px;
        place-items: center;
        margin-bottom: 24px;
        border: 2px solid rgba(255, 200, 74, 0.84);
        border-radius: 999px;
        color: var(--bck-gold);
        font-size: 32px;
        font-weight: 900;
        box-shadow: 0 18px 46px rgba(215, 25, 32, 0.28);
      }

      h1 {
        max-width: 680px;
        margin: 0 auto 18px;
        font-family: Montserrat, Inter, sans-serif;
        font-size: clamp(42px, 9vw, 84px);
        line-height: 0.92;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        max-width: 560px;
        margin: 0 auto;
        color: var(--bck-muted);
        font-size: clamp(17px, 3.8vw, 22px);
        line-height: 1.45;
      }

      .protocol {
        display: none;
        width: fit-content;
        margin: 24px auto 0;
        padding: 10px 14px;
        border: 1px solid var(--bck-line);
        border-radius: 8px;
        color: var(--bck-cream);
        background: rgba(255, 255, 255, 0.06);
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }

      .btn {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 8px;
        color: #120806;
        background: var(--bck-gold);
        font-weight: 900;
        text-decoration: none;
      }

      .btn--ghost {
        color: var(--bck-cream);
        background: transparent;
        border: 1px solid var(--bck-line);
      }

      .note {
        margin-top: 30px;
        color: rgba(255, 247, 234, 0.54);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="receipt" aria-labelledby="thanks-title">
        <img class="brand-logo" src="assets/images/bck-mascot-logo.png" alt="BCK Beer Chicken" width="1536" height="1102">
        <div class="check" aria-hidden="true">OK</div>
        <h1 id="thanks-title">Pedido confirmado</h1>
        <p>
          Obrigado por escolher a BCK Beer Chicken. A equipe confirmou seu pedido
          pelo WhatsApp e agora vai preparar tudo com capricho.
        </p>
        <p class="protocol" data-protocol></p>
        <div class="actions">
          <a class="btn" href="/" data-track="order_again">Ver cardápio</a>
          <a class="btn btn--ghost" href="https://wa.me/5528999329677" target="_blank" rel="noopener" data-track="whatsapp_followup">
            Falar com a equipe
          </a>
        </div>
        <p class="note">BCK Beer Chicken - Cachoeiro de Itapemirim</p>
      </section>
    </main>

    <noscript>
      <img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=746956188164996&amp;ev=PageView&amp;noscript=1">
    </noscript>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var orderId = params.get("pedido") || params.get("protocolo") || "";
        var valueText = params.get("valor") || params.get("value") || "";
        var parsedValue = parseMoney(valueText);
        var storedValue = storedCartValue();
        var value = Number.isFinite(parsedValue) && parsedValue > 0
          ? parsedValue
          : Number.isFinite(storedValue) && storedValue > 0
            ? storedValue
            : 1;
        var currency = (window.BCK_CONFIG && window.BCK_CONFIG.currency) || "BRL";
        var protocolEl = document.querySelector("[data-protocol]");
        var eventId = "pur_" + (orderId || Date.now());
        var eventPayload = {
          currency: currency,
          value: value,
          content_name: "Pedido confirmado pelo WhatsApp",
          content_category: "WhatsApp",
          status: "confirmed_whatsapp"
        };

        if (orderId && protocolEl) {
          protocolEl.textContent = "Protocolo: " + orderId;
          protocolEl.style.display = "block";
          eventPayload.order_id = orderId;
        }

        window.dataLayer = window.dataLayer || [];
        if (orderId) {
          window.dataLayer.push({
            event: "Purchase_WhatsApp",
            event_id: eventId,
            order_id: orderId,
            transaction_id: orderId,
            currency: currency,
            value: value,
            source: "obrigado_page"
          });

          if (typeof window.fbq === "function") {
            window.fbq("trackCustom", "Purchase_WhatsApp", eventPayload, { eventID: eventId });
          }

          if (typeof window.gtag === "function") {
            window.gtag("event", "conversion", {
              send_to: "AW-18132933431/oImLCOfw6KUcELe2usZD",
              value: value,
              currency: currency,
              transaction_id: orderId
            });

            window.gtag("event", "purchase", {
              transaction_id: orderId,
              value: value,
              currency: currency
            });
          }
        } else {
          window.dataLayer.push({
            event: "Purchase_WhatsApp_missing_order_id",
            currency: currency,
            value: value,
            source: "obrigado_page"
          });
        }

        document.addEventListener("click", function (event) {
          var tracked = event.target.closest("[data-track]");
          if (!tracked) return;

          var name = tracked.getAttribute("data-track");
          window.dataLayer.push({
            event: "obrigado_click",
            label: name,
            href: tracked.href
          });

          if (typeof window.fbq === "function") {
            window.fbq("trackCustom", "BCK_obrigado_click", {
              content_name: name,
              click_url: tracked.href
            });
          }
        });

        function parseMoney(text) {
          var normalized = String(text || "")
            .replace(/[^\d,.]/g, "")
            .replace(/\.(?=\d{3}(?:\D|$))/g, "")
            .replace(",", ".");
          var parsed = Number(normalized);
          return Number.isFinite(parsed) ? parsed : 0;
        }

        function storedCartValue() {
          try {
            var saved = localStorage.getItem("bck_cart_total") || sessionStorage.getItem("bck_cart_total") || "";
            return parseMoney(saved);
          } catch (error) {
            return 0;
          }
        }
      })();
    </script>
  </body>
</html>
